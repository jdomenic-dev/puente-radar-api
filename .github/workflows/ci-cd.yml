name: CI / CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # CI — lint, test, build
  # ───────────────────────────────────────────────────────────────────────────
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      # Note: unit tests run here. E2E tests need PostgreSQL; run them in a
      # separate job if you want them on every PR.
      - name: Unit tests
        run: pnpm run test -- --ci --coverage=false

  # ───────────────────────────────────────────────────────────────────────────
  # Build and push Docker image to Amazon ECR (only on main / staging pushes)
  # ───────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to Amazon ECR
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'

    outputs:
      image-uri: ${{ steps.image.outputs.uri }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.ref_name }}-${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "Pushed $IMAGE_URI"

      - name: Save image URI for deploy job
        id: image
        run: |
          echo "uri=${{ env.IMAGE_URI }}" >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────────────────
  # Deploy to EC2
  #############################################################################
  # Assumes the EC2 instance already has:
  #   - Docker installed
  #   - AWS CLI installed and configured with permission to read ECR
  #   - A /home/ec2-user/puente-radar.env file with all required env vars
  #     (see README.md for the list)
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'

    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Deploy to EC2 via SSH
        env:
          EC2_HOST: ${{ github.ref_name == 'main' && secrets.EC2_HOST_PROD || secrets.EC2_HOST_STAGING }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          IMAGE_URI: ${{ needs.build-and-push.outputs.image-uri }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          echo "$EC2_SSH_KEY" > ec2_key.pem
          chmod 600 ec2_key.pem

          ssh -o StrictHostKeyChecking=no -i ec2_key.pem "$EC2_USERNAME@$EC2_HOST" << 'EOF'
            set -e
            echo "Pulling image $IMAGE_URI"
            aws ecr get-login-password --region "$AWS_REGION" | \
              docker login --username AWS --password-stdin "${IMAGE_URI%%/*}"

            docker pull "$IMAGE_URI"

            echo "Stopping existing container..."
            docker stop puente-radar-api || true
            docker rm puente-radar-api || true

            echo "Starting new container..."
            docker run -d \
              --name puente-radar-api \
              --restart unless-stopped \
              -p 80:3000 \
              --env-file /home/ec2-user/puente-radar.env \
              "$IMAGE_URI"

            echo "Cleaning up old images..."
            docker image prune -af --filter "until=168h" || true
          EOF

          rm -f ec2_key.pem
