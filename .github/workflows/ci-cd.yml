name: CI / CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # CI — lint, test, build
  # ───────────────────────────────────────────────────────────────────────────
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      # Note: unit tests run here. E2E tests need PostgreSQL; run them in a
      # separate job if you want them on every PR.
      - name: Unit tests
        run: pnpm run test --ci --coverage=false

  # ───────────────────────────────────────────────────────────────────────────
  # Build and push Docker image to Amazon ECR (only on main / staging pushes)
  # ───────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to Amazon ECR
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.ref_name }}-${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "Pushed $IMAGE_URI"

  # ───────────────────────────────────────────────────────────────────────────
  # Deploy to EC2 through AWS Systems Manager
  #############################################################################
  # Assumes the EC2 instance already has:
  #   - Docker installed
  #   - AWS CLI installed and configured with permission to read ECR
  #   - SSM Agent online and an instance role with SSM managed-node permissions
  #   - A /home/ec2-user/puente-radar.env file with all required env vars
  #     (see README.md for the list)
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'

    permissions:
      contents: read

    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to EC2 via SSM Run Command
        env:
          EC2_INSTANCE_ID: ${{ github.ref_name == 'main' && secrets.EC2_INSTANCE_ID_PROD || secrets.EC2_INSTANCE_ID_STAGING }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          IMAGE_TAG: ${{ github.ref_name }}-${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$EC2_INSTANCE_ID" ] || [ -z "$ECR_REPOSITORY" ] || [ -z "$AWS_REGION" ]; then
            echo "EC2 instance ID, ECR repository, and AWS region are required for deployment." >&2
            exit 1
          fi

          ECR_REPOSITORY_URI="$(aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --query 'repositories[0].repositoryUri' \
            --output text)"
          IMAGE_URI="$ECR_REPOSITORY_URI:$IMAGE_TAG"

          printf -v IMAGE_URI_Q '%q' "$IMAGE_URI"
          printf -v AWS_REGION_Q '%q' "$AWS_REGION"
          COMMAND="sudo -u ec2-user -- bash -c 'exec /home/ec2-user/deploy.sh \"\$1\" \"\$2\"' deploy $IMAGE_URI_Q $AWS_REGION_Q"
          PARAMETERS="$(jq -cn --arg command "$COMMAND" '{commands: [$command]}')"

          COMMAND_ID="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$EC2_INSTANCE_ID" \
            --parameters "$PARAMETERS" \
            --comment "Deploy Puente Radar $IMAGE_URI" \
            --query 'Command.CommandId' \
            --output text)"

          echo "Waiting for SSM command $COMMAND_ID"
          for attempt in $(seq 1 120); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Pending|InProgress|Delayed|"")
                sleep 5
                ;;
              *)
                echo "SSM deployment failed with status: $STATUS" >&2
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for SSM deployment command $COMMAND_ID" >&2
          exit 1
