name: CI / CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # CI — lint, test, build
  # ───────────────────────────────────────────────────────────────────────────
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      # Note: unit tests run here. E2E tests need PostgreSQL; run them in a
      # separate job if you want them on every PR.
      - name: Unit tests
        run: pnpm run test -- --ci --coverage=false

  # ───────────────────────────────────────────────────────────────────────────
  # Build and push Docker image to Amazon ECR (only on main / staging pushes)
  # ───────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to Amazon ECR
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'

    outputs:
      image-uri: ${{ steps.image.outputs.uri }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image to ECR
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.ref_name }}-${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE_URI"

  # ───────────────────────────────────────────────────────────────────────────
  # Deploy to EC2
  #############################################################################
  # Assumes the EC2 instance already has:
  #   - Docker installed
  #   - AWS CLI installed and configured with permission to read ECR
  #   - A /home/ec2-user/puente-radar.env file with all required env vars
  #     (see README.md for the list)
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'

    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Deploy to EC2 via SSH
        env:
          EC2_HOST: ${{ github.ref_name == 'main' && secrets.EC2_HOST_PROD || secrets.EC2_HOST_STAGING }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          IMAGE_URI: ${{ needs.build-and-push.outputs.image-uri }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          printf '%s' "$EC2_SSH_KEY" > ec2_key.pem
          chmod 600 ec2_key.pem
          trap 'rm -f ec2_key.pem' EXIT

          # OpenSSH joins remote arguments into a shell command. Quote each
          # deployment input before passing it to the remote bash process.
          printf -v IMAGE_URI_Q '%q' "$IMAGE_URI"
          printf -v AWS_REGION_Q '%q' "$AWS_REGION"

          ssh -o StrictHostKeyChecking=no -i ec2_key.pem "$EC2_USERNAME@$EC2_HOST" \
            "bash -s -- $IMAGE_URI_Q $AWS_REGION_Q" <<'EOF'
            set -euo pipefail

            IMAGE_URI="${1:?Image URI is required}"
            AWS_REGION="${2:?AWS region is required}"
            APP_CONTAINER=puente-radar-api
            BACKUP_CONTAINER=puente-radar-api-rollback
            ENV_FILE=/home/ec2-user/puente-radar.env
            HAD_PREVIOUS=false

            if [ ! -s "$ENV_FILE" ]; then
              echo "Deployment environment file is missing or empty: $ENV_FILE" >&2
              exit 1
            fi

            rollback() {
              echo "New container failed; restoring the previous container." >&2
              docker rm -f "$APP_CONTAINER" >/dev/null 2>&1 || true
              if [ "$HAD_PREVIOUS" = true ]; then
                if ! docker rename "$BACKUP_CONTAINER" "$APP_CONTAINER" || \
                   ! docker start "$APP_CONTAINER"; then
                  echo "Automatic rollback failed; previous container remains as $BACKUP_CONTAINER." >&2
                  return 1
                fi
              fi
            }

            echo "Authenticating to ECR"
            aws ecr get-login-password --region "$AWS_REGION" | \
              docker login --username AWS --password-stdin "${IMAGE_URI%%/*}"

            echo "Pulling deployment image"
            docker pull "$IMAGE_URI"

            echo "Running database migrations"
            docker run --rm \
              --env-file "$ENV_FILE" \
              "$IMAGE_URI" \
              pnpm run migration:run:prod

            if docker container inspect "$BACKUP_CONTAINER" >/dev/null 2>&1; then
              echo "Refusing to overwrite existing rollback container: $BACKUP_CONTAINER" >&2
              exit 1
            fi

            if docker container inspect "$APP_CONTAINER" >/dev/null 2>&1; then
              docker rename "$APP_CONTAINER" "$BACKUP_CONTAINER"
              HAD_PREVIOUS=true
              if ! docker stop "$BACKUP_CONTAINER"; then
                rollback || true
                exit 1
              fi
            fi

            echo "Starting new container"
            if ! docker run -d \
              --name "$APP_CONTAINER" \
              --restart unless-stopped \
              -p 80:3000 \
              --env-file "$ENV_FILE" \
              "$IMAGE_URI"; then
              rollback || true
              exit 1
            fi

            HEALTHY=false
            for attempt in $(seq 1 12); do
              if docker exec "$APP_CONTAINER" node -e \
                "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
                HEALTHY=true
                break
              fi
              echo "Health check attempt $attempt/12 failed; retrying in 5 seconds"
              sleep 5
            done

            if [ "$HEALTHY" != true ]; then
              echo "New container did not become healthy." >&2
              docker logs --tail 100 "$APP_CONTAINER" >&2 || true
              rollback || true
              exit 1
            fi

            if [ "$HAD_PREVIOUS" = true ]; then
              docker rm "$BACKUP_CONTAINER"
            fi

            echo "Deployment healthy; cleaning up old images"
            docker image prune -af --filter "until=168h" || true
          EOF
