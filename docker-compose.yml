services:
  postgres:
    image: postgres:16-alpine
    container_name: puente-radar-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: puente_radar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    # redis-stack bundles Redis + RedisInsight web UI (no extra container needed)
    image: redis/redis-stack:latest
    container_name: puente-radar-redis
    restart: unless-stopped
    # Host port 6380 avoids conflict with a Redis already running on 6379
    # for another project. App connects via REDIS_URL=redis://localhost:6380
    # Port 8006 → RedisInsight web UI at http://localhost:8006
    ports:
      - "6380:6379"
      - "8006:8001"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
