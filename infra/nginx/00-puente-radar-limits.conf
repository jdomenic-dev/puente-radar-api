# /etc/nginx/conf.d/00-puente-radar-limits.conf  (http context)
# Outer rate limit: abusive clients are cut here, before they cost Node any CPU.
# The API keeps its own limiter (Redis-backed) as the second layer.

server_tokens off;

# 10 requests/second per client IP, 10 MB of state (~160k IPs).
limit_req_zone $binary_remote_addr zone=puente_api:10m rate=10r/s;
limit_req_status 429;
